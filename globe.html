<!doctype html>
<html lang="no">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Oslo Globe – Wanderlust-ish (landmask + borders glow)</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #060a14;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
            #hud {
                position: fixed;
                left: 12px;
                bottom: 12px;
                max-width: min(980px, calc(100vw - 24px));
                font:
                    12px/1.35 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                color: #eaeaea;
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255, 255, 255, 0.12);
                padding: 10px 12px;
                border-radius: 10px;
                white-space: pre-wrap;
                pointer-events: none;
            }
            #hud.ok {
                display: none;
            }
        </style>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
                }
            }
        </script>
    </head>

    <body>
        <div id="hud">Init…</div>

        <script type="module">
            import * as THREE from "three";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";
            import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
            import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
            import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

            const hud = document.getElementById("hud");
            const log = (msg) => (hud.textContent = String(msg));
            const ok = () => hud.classList.add("ok");

            const CONFIG = {
                radius: 1.0,
                segments: 192,

                // Assets (må ligge ved siden av globe.html)
                landMaskPng: "./oslo_landmask.png",
                bordersPng: "./oslo_borders.png",

                // Orientering av Oslo på kula (juster etter behov)
                overlayYawDeg: 0,

                // Kontroll (samme som før)
                autoRotate: true,
                autoRotateSpeed: 0.45,

                // Wanderlust-ish fargebase
                oceanColorA: "#4AAED5", // lys hav
                oceanColorB: "#2C86B8", // mørkere hav
                oceanDeep: "#1A4F7A", // dyp skygge
                landColorA: "#DDE4D6", // lys land
                landColorB: "#BFD2B6", // mørkere land

                // Borders (synlige + glow)
                borderColor: "#EAF2FF", // synlig strek (ikke glød)
                glowColor: "#FFFFFF", // emissive/glow farge
                borderOpacity: 0.55, // synlig strek uten glow
                glowOpacity: 1.0, // glow intensitet

                // Bloom (kun glow-mesh)
                bloom: {
                    enabled: true,
                    strength: 0.9,
                    radius: 0.35,
                    threshold: 0.85,
                },
            };

            const BLOOM_LAYER = 1;

            // ---------- Three basics ----------
            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(new THREE.Color("#060a14"), 6.0, 14.0);

            const camera = new THREE.PerspectiveCamera(
                35,
                window.innerWidth / window.innerHeight,
                0.01,
                100,
            );
            camera.position.set(0, 0, 3.2);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: "high-performance",
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 2.2;
            controls.maxDistance = 6.0;
            controls.autoRotate = CONFIG.autoRotate;
            controls.autoRotateSpeed = CONFIG.autoRotateSpeed;

            // Lys for subtil volumfølelse i shader (vi bruker også faux-light i shader)
            scene.add(new THREE.AmbientLight(0xffffff, 0.25));
            const key = new THREE.DirectionalLight(0xffffff, 0.85);
            key.position.set(2.2, 1.4, 1.8);
            scene.add(key);

            const geom = new THREE.SphereGeometry(
                CONFIG.radius,
                CONFIG.segments,
                CONFIG.segments,
            );

            // ---------- Shader: ocean + land (integrert, ikke “klistret kart”) ----------
            const uniforms = {
                uLandMask: { value: null },
                uTime: { value: 0.0 },
                uOceanA: { value: new THREE.Color(CONFIG.oceanColorA) },
                uOceanB: { value: new THREE.Color(CONFIG.oceanColorB) },
                uOceanDeep: { value: new THREE.Color(CONFIG.oceanDeep) },
                uLandA: { value: new THREE.Color(CONFIG.landColorA) },
                uLandB: { value: new THREE.Color(CONFIG.landColorB) },
                uLightDir: {
                    value: new THREE.Vector3(0.65, 0.35, 0.68).normalize(),
                },
            };

            const vert = `
        varying vec2 vUv;
        varying vec3 vN;
        varying vec3 vWPos;
        void main() {
          vUv = uv;
          vN = normalize(normalMatrix * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `;

            // Merk: landMask er 2D equirect. Dette er “Oslo som kontinent” + hav.
            const frag = `
        precision highp float;

        uniform sampler2D uLandMask;
        uniform float uTime;

        uniform vec3 uOceanA;
        uniform vec3 uOceanB;
        uniform vec3 uOceanDeep;
        uniform vec3 uLandA;
        uniform vec3 uLandB;
        uniform vec3 uLightDir;

        varying vec2 vUv;
        varying vec3 vN;
        varying vec3 vWPos;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 345.45));
          p += dot(p, p + 34.345);
          return fract(p.x * p.y);
        }

        void main() {
          vec3 N = normalize(vN);

          // View dir (approx)
          vec3 V = normalize(-vWPos);

          // Land mask
          float land = texture2D(uLandMask, vUv).r;
          // Hard mask -> myk kant
          float landEdge = smoothstep(0.35, 0.65, land);

          // Faux lighting
          float ndl = clamp(dot(N, uLightDir) * 0.5 + 0.5, 0.0, 1.0);
          float shade = pow(ndl, 1.35);

          // Rim/fresnel (Wanderlust følelse)
          float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.8);

          // Subtil “atmosphere” og vignette
          float v = smoothstep(0.0, 1.0, shade);
          float vignette = 0.85 + 0.15 * pow(1.0 - ndl, 1.5);

          // Subtil noise for å unngå “flat plast”
          float n = hash21(vUv * vec2(900.0, 450.0) + uTime * 0.02);
          n = (n - 0.5) * 0.035;

          // Ocean gradient
          vec3 ocean = mix(uOceanDeep, mix(uOceanB, uOceanA, v), 0.78);
          ocean += n;
          ocean *= vignette;

          // Land shading
          vec3 landCol = mix(uLandB, uLandA, v);
          landCol += n * 0.75;
          landCol *= (0.92 + 0.08 * shade);

          // Blend land over ocean
          vec3 col = mix(ocean, landCol, landEdge);

          // Atmosfærisk rim tint
          col += vec3(0.20, 0.35, 0.55) * rim * 0.18;

          gl_FragColor = vec4(col, 1.0);
        }
      `;

            const mainMat = new THREE.ShaderMaterial({
                uniforms,
                vertexShader: vert,
                fragmentShader: frag,
            });

            const mainMesh = new THREE.Mesh(geom, mainMat);
            mainMesh.rotation.y = THREE.MathUtils.degToRad(
                CONFIG.overlayYawDeg,
            );
            mainMesh.layers.set(0);
            scene.add(mainMesh);

            // ---------- Borders (synlig strek uten bloom) ----------
            const bordersMat = new THREE.MeshBasicMaterial({
                transparent: true,
                depthWrite: false,
                color: new THREE.Color(CONFIG.borderColor),
                opacity: CONFIG.borderOpacity,
            });
            bordersMat.toneMapped = false;

            const bordersMesh = new THREE.Mesh(geom, bordersMat);
            bordersMesh.scale.setScalar(1.0015);
            bordersMesh.rotation.y = THREE.MathUtils.degToRad(
                CONFIG.overlayYawDeg,
            );
            bordersMesh.layers.set(0);
            scene.add(bordersMesh);

            // ---------- Glow mesh (kun bloom-layer) ----------
            const glowMat = new THREE.MeshBasicMaterial({
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                color: new THREE.Color(CONFIG.glowColor),
                opacity: CONFIG.glowOpacity,
            });
            glowMat.toneMapped = false;

            const glowMesh = new THREE.Mesh(geom, glowMat);
            glowMesh.scale.setScalar(1.003);
            glowMesh.rotation.y = THREE.MathUtils.degToRad(
                CONFIG.overlayYawDeg,
            );
            glowMesh.layers.set(BLOOM_LAYER);
            scene.add(glowMesh);

            // ---------- Composer: bloom kun for glow-layer ----------
            const composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));

            let bloomPass = null;
            if (CONFIG.bloom.enabled) {
                bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    CONFIG.bloom.strength,
                    CONFIG.bloom.radius,
                    CONFIG.bloom.threshold,
                );
                composer.addPass(bloomPass);
            }

            // ---------- Texture loading ----------
            const loader = new THREE.TextureLoader();

            function loadTex(url) {
                return new Promise((resolve, reject) => {
                    const bust = `${url}${url.includes("?") ? "&" : "?"}v=${Date.now()}`;
                    loader.load(
                        bust,
                        (t) => {
                            t.colorSpace = THREE.SRGBColorSpace;
                            t.flipY = false;
                            t.wrapS = THREE.ClampToEdgeWrapping;
                            t.wrapT = THREE.ClampToEdgeWrapping;
                            t.anisotropy = 8;
                            resolve(t);
                        },
                        undefined,
                        () => reject(new Error(`Kunne ikke laste: ${url}`)),
                    );
                });
            }

            (async () => {
                try {
                    log("Laster masker… (oslo_landmask.png, oslo_borders.png)");

                    const [landMask, bordersMask] = await Promise.all([
                        loadTex(CONFIG.landMaskPng),
                        loadTex(CONFIG.bordersPng),
                    ]);

                    // Land mask i shader
                    uniforms.uLandMask.value = landMask;

                    // Borders-mesh bruker bordersMask som alpha via map
                    bordersMat.map = bordersMask;
                    bordersMat.needsUpdate = true;

                    // Glow-mesh bruker samme bordersMask
                    glowMat.map = bordersMask;
                    glowMat.needsUpdate = true;

                    ok();
                } catch (e) {
                    log(
                        `Mask-load feilet:\n${e.message}\n\nSjekk:\n- at oslo_landmask.png og oslo_borders.png finnes i samme mappe\n- at du kjører via lokal server`,
                    );
                    console.error(e);
                }
            })();

            // ---------- Render loop ----------
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                uniforms.uTime.value += clock.getDelta();
                controls.update();

                // 1) Bloom (kun glow layer)
                camera.layers.set(BLOOM_LAYER);
                composer.render();

                // 2) Normal (main + borders uten bloom)
                camera.layers.set(0);
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
                if (bloomPass)
                    bloomPass.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
