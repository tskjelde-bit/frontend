<!doctype html>
<html lang="no">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Oslo Globe – Boroughs (v5)</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
            #badge {
                position: fixed;
                left: 12px;
                top: 12px;
                font:
                    12px/1 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                color: #eaeaea;
                background: rgba(0, 0, 0, 0.55);
                border: 1px solid rgba(255, 255, 255, 0.14);
                padding: 6px 8px;
                border-radius: 10px;
                pointer-events: none;
            }
            #hud {
                position: fixed;
                left: 12px;
                bottom: 12px;
                max-width: min(980px, calc(100vw - 24px));
                font:
                    12px/1.35 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                color: #eaeaea;
                background: rgba(0, 0, 0, 0.55);
                border: 1px solid rgba(255, 255, 255, 0.14);
                padding: 10px 12px;
                border-radius: 10px;
                white-space: pre-wrap;
                pointer-events: none;
            }
        </style>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
                }
            }
        </script>
    </head>

    <body>
        <div id="badge">v5</div>
        <div id="hud">Init…</div>

        <script type="module">
            import * as THREE from "three";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";
            import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
            import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
            import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

            const hud = document.getElementById("hud");
            const log = (msg) => {
                hud.textContent = String(msg);
            };

            const CONFIG = {
                radius: 1.0,
                segments: 128,

                // laghøyder
                fillScale: 1.001,
                lineScale: 1.002,

                // texture
                texW: 2048,
                texH: 1024,
                padding: 0.03,
                svgUrl: "./oslo.svg",

                // linjer
                lineColor: "#ffffff",
                lineWidthHint: 1.0,
                alphaTest: 0.06,

                // rotasjon
                autoRotate: true,
                autoRotateSpeed: 0.45,
                overlayYawDeg: 0,

                // Wanderlust-finish
                bloom: {
                    enabled: true,
                    strength: 0.35,
                    radius: 0.25,
                    threshold: 0.85,
                },
            };

            function injectStyle(svgText, css) {
                return svgText.replace(/<svg\b([^>]*)>/i, (m, attrs) => {
                    const style = `<style>${css}</style>`;
                    return `<svg ${attrs}>${style}`;
                });
            }

            async function svgToCanvas({
                url,
                width,
                height,
                padding,
                mode,
                lineColor,
                lineWidthHint,
            }) {
                const bust = `${url}${url.includes("?") ? "&" : "?"}v=${Date.now()}`;
                const r = await fetch(bust, { cache: "no-store" });
                if (!r.ok)
                    throw new Error(
                        `SVG fetch feilet: ${r.status} ${r.statusText} (${url})`,
                    );
                let svgText = await r.text();

                if (mode === "fillsOnly") {
                    // Viktig: behold fill (farger), men fjern stroke helt
                    svgText = injectStyle(
                        svgText,
                        `
            path, line, polyline, polygon, rect, circle, ellipse {
              stroke: none !important;
            }
          `,
                    );
                } else if (mode === "linesOnly") {
                    // Kun konturer: ingen fill, hvit stroke
                    svgText = injectStyle(
                        svgText,
                        `
            path, line, polyline, polygon, rect, circle, ellipse {
              fill: none !important;
              stroke: ${lineColor} !important;
              stroke-width: ${lineWidthHint} !important;
              stroke-linecap: round !important;
              stroke-linejoin: round !important;
            }
          `,
                    );
                } else {
                    throw new Error(`Ukjent mode: ${mode}`);
                }

                const blob = new Blob([svgText], {
                    type: "image/svg+xml;charset=utf-8",
                });
                const blobUrl = URL.createObjectURL(blob);

                const img = await new Promise((resolve, reject) => {
                    const im = new Image();
                    im.onload = () => resolve(im);
                    im.onerror = () =>
                        reject(new Error("Kunne ikke decode SVG til Image()"));
                    im.src = blobUrl;
                });
                URL.revokeObjectURL(blobUrl);

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d", { alpha: true });
                ctx.clearRect(0, 0, width, height);

                const safeW = width * (1 - padding * 2);
                const safeH = height * (1 - padding * 2);
                const scale = Math.min(safeW / img.width, safeH / img.height);

                const drawW = img.width * scale;
                const drawH = img.height * scale;
                const x = (width - drawW) / 2;
                const y = (height - drawH) / 2;

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
                ctx.drawImage(img, x, y, drawW, drawH);

                return { canvas, ctx };
            }

            function canvasToTexture(canvas) {
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.flipY = false;
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.premultiplyAlpha = true;
                tex.anisotropy = 8;
                tex.needsUpdate = true;
                return tex;
            }

            function estimateInkCoverage(ctx, w, h) {
                // Rask indikator: hvor mange piksler har alpha > 0?
                // Hvis fills finnes, blir dette typisk mye høyere enn bare linjer.
                const img = ctx.getImageData(0, 0, w, h).data;
                let nonZero = 0;
                const step = 8; // sampling for speed
                for (let i = 3; i < img.length; i += 4 * step) {
                    if (img[i] > 0) nonZero++;
                }
                return nonZero; // relativt tall (kun diagnose)
            }

            // Scene / camera / renderer
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(
                35,
                window.innerWidth / window.innerHeight,
                0.01,
                100,
            );
            camera.position.set(0, 0, 3.2);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: "high-performance",
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 2.2;
            controls.maxDistance = 6.0;
            controls.autoRotate = CONFIG.autoRotate;
            controls.autoRotateSpeed = CONFIG.autoRotateSpeed;

            // Lys (base)
            scene.add(new THREE.AmbientLight(0xffffff, 0.35));
            const key = new THREE.DirectionalLight(0xffffff, 1.15);
            key.position.set(2.5, 1.5, 2.0);
            scene.add(key);
            const fill = new THREE.DirectionalLight(0xffffff, 0.45);
            fill.position.set(-2.2, -0.8, 1.2);
            scene.add(fill);

            // Globe group
            const globeGroup = new THREE.Group();
            scene.add(globeGroup);

            const geom = new THREE.SphereGeometry(
                CONFIG.radius,
                CONFIG.segments,
                CONFIG.segments,
            );

            // Base: behold dine Wanderlust-verdier (lim inn hvis du har eksakt match)
            const baseMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color("#3f7e83"),
                roughness: 0.62,
                metalness: 0.08,
            });
            globeGroup.add(new THREE.Mesh(geom, baseMat));

            // Fill overlay: unlit, ikke tonemapped
            const fillMat = new THREE.MeshBasicMaterial({
                transparent: true,
                depthWrite: false,
            });
            fillMat.toneMapped = false;
            const fillMesh = new THREE.Mesh(geom, fillMat);
            fillMesh.scale.setScalar(CONFIG.fillScale);
            fillMesh.rotation.y = THREE.MathUtils.degToRad(
                CONFIG.overlayYawDeg,
            );
            globeGroup.add(fillMesh);

            // Line overlay: unlit, ikke tonemapped
            const lineMat = new THREE.MeshBasicMaterial({
                transparent: true,
                alphaTest: CONFIG.alphaTest,
                depthWrite: false,
                color: new THREE.Color("#ffffff"),
            });
            lineMat.toneMapped = false;
            const lineMesh = new THREE.Mesh(geom, lineMat);
            lineMesh.scale.setScalar(CONFIG.lineScale);
            lineMesh.rotation.y = THREE.MathUtils.degToRad(
                CONFIG.overlayYawDeg,
            );
            globeGroup.add(lineMesh);

            // Postprocessing
            const composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            let bloomPass = null;
            if (CONFIG.bloom.enabled) {
                bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    CONFIG.bloom.strength,
                    CONFIG.bloom.radius,
                    CONFIG.bloom.threshold,
                );
                composer.addPass(bloomPass);
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                composer.render();
            }
            animate();

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
                if (bloomPass)
                    bloomPass.setSize(window.innerWidth, window.innerHeight);
            });

            // Load overlays
            (async () => {
                try {
                    log(
                        `Laster SVG fra ${CONFIG.svgUrl} …\n(v5: fill=stroke:none, lines=fill:none)`,
                    );

                    const fillCanvasRes = await svgToCanvas({
                        url: CONFIG.svgUrl,
                        width: CONFIG.texW,
                        height: CONFIG.texH,
                        padding: CONFIG.padding,
                        mode: "fillsOnly",
                    });

                    const lineCanvasRes = await svgToCanvas({
                        url: CONFIG.svgUrl,
                        width: CONFIG.texW,
                        height: CONFIG.texH,
                        padding: CONFIG.padding,
                        mode: "linesOnly",
                        lineColor: CONFIG.lineColor,
                        lineWidthHint: CONFIG.lineWidthHint,
                    });

                    // Diagnose: finnes det faktisk fylte flater?
                    const fillInk = estimateInkCoverage(
                        fillCanvasRes.ctx,
                        CONFIG.texW,
                        CONFIG.texH,
                    );
                    const lineInk = estimateInkCoverage(
                        lineCanvasRes.ctx,
                        CONFIG.texW,
                        CONFIG.texH,
                    );

                    fillMat.map = canvasToTexture(fillCanvasRes.canvas);
                    fillMat.needsUpdate = true;

                    lineMat.map = canvasToTexture(lineCanvasRes.canvas);
                    lineMat.needsUpdate = true;

                    log(
                        `OK: overlay lastet.\n` +
                            `Diagnose:\n` +
                            `- fill pixels (sampled): ${fillInk}\n` +
                            `- line pixels (sampled): ${lineInk}\n\n` +
                            `Hvis fill pixels ~ 0: SVG-en har ingen fylte bydeler. Da må du levere en fill-SVG.`,
                    );
                } catch (e) {
                    log(
                        `Overlay feilet:\n${e.message}\n\nSjekk:\n- oslo.svg ved siden av globe.html\n- kjører via lokal server\n- Network: oslo.svg -> 200`,
                    );
                    console.error(e);
                }
            })();
        </script>
    </body>
</html>
